services:
  - type: web
    name: bubbi-cafe
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.20.0
      - key: MONGODB_URI
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: family-uploads
      mountPath: /var/data
      sizeGB: 1
